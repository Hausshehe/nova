name: Recover Broader Trading Research Campaign (SAFE)

on:
  workflow_dispatch:
    inputs:
      source_run_id:
        description: "Frozen failed campaign run whose successful artifacts are reused"
        required: true
        type: string
      recovery_commit:
        description: "Reviewed recovery commit; must equal the pinned reviewed SHA"
        required: true
        type: string

concurrency:
  group: nova-broader-campaign-recovery
  cancel-in-progress: false

jobs:
  recover:
    runs-on: ubuntu-latest
    timeout-minutes: 240
    permissions:
      actions: read
      contents: read
    env:
      SOURCE_RUN_ID: ${{ inputs.source_run_id }}
      RECOVERY_COMMIT: ${{ inputs.recovery_commit }}
      FROZEN_SOURCE_COMMIT: d79afc0e463be97a419e20bde348650cdb55c945
      REVIEWED_RECOVERY_COMMIT: dcb7f545474e4895fb9d08c0fc494973b401c9aa

    steps:
      - name: Verify source and reviewed recovery commit provenance
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python - <<'PY'
          import json
          import os
          import urllib.request

          repo = os.environ["GITHUB_REPOSITORY"]
          source_run_id = os.environ["SOURCE_RUN_ID"].strip()
          frozen = os.environ["FROZEN_SOURCE_COMMIT"]
          reviewed = os.environ["REVIEWED_RECOVERY_COMMIT"]
          recovery = os.environ["RECOVERY_COMMIT"].strip()

          if source_run_id != "32293018258":
              raise SystemExit(f"unexpected_source_run:{source_run_id}")
          if recovery != reviewed:
              raise SystemExit(f"unapproved_recovery_commit:{recovery}")

          def get_json(url: str):
              req = urllib.request.Request(
                  url,
                  headers={
                      "Accept": "application/vnd.github+json",
                      "Authorization": f"Bearer {os.environ['GH_TOKEN']}",
                      "X-GitHub-Api-Version": "2022-11-28",
                  },
              )
              with urllib.request.urlopen(req, timeout=30) as response:
                  return json.load(response)

          run = get_json(f"https://api.github.com/repos/{repo}/actions/runs/{source_run_id}")
          if run.get("repository", {}).get("full_name") != repo:
              raise SystemExit("source_run_repository_mismatch")
          if run.get("status") != "completed" or run.get("conclusion") not in {"failure", "cancelled"}:
              raise SystemExit(f"source_run_not_recoverable:{run.get('status')}:{run.get('conclusion')}")
          if run.get("head_sha") != frozen:
              raise SystemExit(f"frozen_source_head_mismatch:{run.get('head_sha')}")

          comparison = get_json(
              f"https://api.github.com/repos/{repo}/compare/{frozen}...{recovery}"
          )
          if comparison.get("status") != "ahead" or comparison.get("behind_by") != 0:
              raise SystemExit(
                  f"recovery_not_clean_descendant:status={comparison.get('status')} "
                  f"ahead={comparison.get('ahead_by')} behind={comparison.get('behind_by')}"
              )
          allowed = {
              ".github/workflows/trading-research-tests.yml",
              "tests/test_dukascopy_recovery_from_frozen.py",
              "trading_research/dukascopy_history.py",
              "trading_research/migrate_legacy_broader_artifacts.py",
              "trading_research/rebuild_recovery_manifest.py",
          }
          changed = {item["filename"] for item in comparison.get("files", [])}
          unexpected = changed - allowed
          if unexpected:
              raise SystemExit(f"recovery_contains_unapproved_files:{sorted(unexpected)}")
          print(
              f"PROVENANCE PASS source={frozen} recovery={recovery} "
              f"ahead={comparison.get('ahead_by')} files={sorted(changed)}",
              flush=True,
          )
          PY

      - name: Checkout reviewed recovery commit
        uses: actions/checkout@v4
        with:
          ref: ${{ env.RECOVERY_COMMIT }}
          clean: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install research dependencies
        run: python -m pip install --disable-pip-version-check -r requirements-trading-research.txt pytest

      - name: Run focused recovery tests
        run: python -m pytest -q tests/test_dukascopy_recovery_from_frozen.py

      - name: Download reusable frozen artifacts
        uses: actions/download-artifact@v4
        with:
          run-id: ${{ env.SOURCE_RUN_ID }}
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          pattern: frozen-*
          path: data/research/universe_v2
          merge-multiple: true

      - name: Validate reusable artifacts and source snapshot
        run: |
          python - <<'PY'
          from datetime import datetime, timezone
          from pathlib import Path
          from trading_research.data import load_csv
          from trading_research.dukascopy_history import INSTRUMENTS, TIMEFRAMES, _deduplicate_and_validate

          root = Path("data/research/universe_v2")
          frozen_start = datetime(2010, 1, 1, tzinfo=timezone.utc)
          frozen_last_daily = datetime(2025, 12, 31, tzinfo=timezone.utc)
          missing = set()
          for instrument in INSTRUMENTS:
              for timeframe in TIMEFRAMES:
                  path = root / f"{instrument}_{timeframe}.csv"
                  if not path.is_file():
                      missing.add((instrument, timeframe))
                      continue
                  bars = load_csv(path)
                  if _deduplicate_and_validate(bars) != bars:
                      raise SystemExit(f"noncanonical_dataset:{instrument}:{timeframe}")
                  if bars[0].timestamp > frozen_start or bars[-1].timestamp < frozen_last_daily:
                      raise SystemExit(
                          f"source_date_coverage_failure:{instrument}:{timeframe}:"
                          f"start={bars[0].timestamp.isoformat()}:end={bars[-1].timestamp.isoformat()}"
                      )
          expected = {('NAS100','4H'), ('NZDUSD','4H'), ('US500','4H'), ('WTI','1D')}
          if missing != expected:
              raise SystemExit(f"source_snapshot_mismatch:{sorted(missing)}")
          print(f"SOURCE SNAPSHOT PASS reused={26-len(missing)} missing={sorted(missing)}", flush=True)
          PY

      - name: Invalidate stale legacy WTI 4H artifact
        run: |
          python - <<'PY'
          from trading_research.migrate_legacy_broader_artifacts import invalidate_legacy_wti_4h
          removed = invalidate_legacy_wti_4h(
              "data/research/universe_v2",
              source_run_id="32293018258",
          )
          print(f"INVALIDATED {removed}", flush=True)
          PY

      - name: Recover exactly five datasets atomically
        run: |
          python - <<'PY'
          import os
          from datetime import datetime, timezone
          from pathlib import Path
          from tempfile import NamedTemporaryFile
          from trading_research.dukascopy_history import DukascopyClient, write_csv

          root = Path("data/research/universe_v2")
          frozen_start = datetime(2010, 1, 1, tzinfo=timezone.utc)
          frozen_last_daily = datetime(2025, 12, 31, tzinfo=timezone.utc)
          expected = {
              ('NAS100','4H'), ('NZDUSD','4H'), ('US500','4H'), ('WTI','1D'), ('WTI','4H')
          }
          missing = {
              (instrument, timeframe)
              for instrument in ('EURUSD','GBPUSD','USDJPY','AUDUSD','USDCAD','USDCHF','NZDUSD','US500','NAS100','US30','XAUUSD','XAGUSD','WTI')
              for timeframe in ('1D','4H')
              if not (root / f"{instrument}_{timeframe}.csv").is_file()
          }
          if missing != expected:
              raise SystemExit(f"post_migration_snapshot_mismatch:{sorted(missing)}")

          for instrument, timeframe in sorted(expected):
              print(f"RECOVERY {instrument} {timeframe}", flush=True)
              temp_path = None
              try:
                  candles = DukascopyClient().historical_prices(
                      instrument=instrument,
                      timeframe=timeframe,
                      start_utc="2010-01-01T00:00:00+00:00",
                      end_utc="2026-01-01T00:00:00+00:00",
                  )
                  if len(candles) < 100:
                      raise RuntimeError(f"insufficient_bars:{len(candles)}")
                  if candles[0].timestamp_utc > frozen_start.isoformat() or candles[-1].timestamp_utc < frozen_last_daily.isoformat():
                      raise RuntimeError(
                          f"recovered_date_coverage_failure:start={candles[0].timestamp_utc}:end={candles[-1].timestamp_utc}"
                      )
                  target = root / f"{instrument}_{timeframe}.csv"
                  with NamedTemporaryFile(prefix=f".{target.name}.", suffix=".tmp", dir=root, delete=False) as temp:
                      temp_path = Path(temp.name)
                  digest = write_csv(candles, temp_path)
                  os.replace(temp_path, target)
                  temp_path = None
                  print(f"RECOVERY COMPLETE {instrument} {timeframe} bars={len(candles)} sha256={digest}", flush=True)
              except Exception as exc:
                  if temp_path is not None:
                      temp_path.unlink(missing_ok=True)
                  raise SystemExit(f"recovery_failed:{instrument}:{timeframe}:{type(exc).__name__}:{exc}") from exc
          PY

      - name: Rebuild and verify frozen manifest
        run: |
          python -m trading_research.rebuild_recovery_manifest
          python -m trading_research.verify_broader_universe

      - name: Verify final frozen date coverage
        run: |
          python - <<'PY'
          from datetime import datetime, timezone
          from pathlib import Path
          from trading_research.data import load_csv
          from trading_research.dukascopy_history import INSTRUMENTS, TIMEFRAMES

          root = Path("data/research/universe_v2")
          start = datetime(2010, 1, 1, tzinfo=timezone.utc)
          last_expected = datetime(2025, 12, 31, tzinfo=timezone.utc)
          for instrument in INSTRUMENTS:
              for timeframe in TIMEFRAMES:
                  bars = load_csv(root / f"{instrument}_{timeframe}.csv")
                  if bars[0].timestamp > start or bars[-1].timestamp < last_expected:
                      raise SystemExit(
                          f"final_date_coverage_failure:{instrument}:{timeframe}:"
                          f"start={bars[0].timestamp.isoformat()}:end={bars[-1].timestamp.isoformat()}"
                      )
          print("FINAL DATE COVERAGE PASS: all 26 datasets span the frozen 2010-2025 period.", flush=True)
          PY

      - name: Run frozen 104-context matrix
        run: python -m trading_research.broader_campaign_runner

      - name: Assert complete matrix evidence
        run: |
          python - <<'PY'
          import csv, json
          from pathlib import Path
          results = Path("data/research/broader_matrix_results.csv")
          summary = Path("data/research/broader_matrix_summary.json")
          if not results.is_file() or not summary.is_file():
              raise SystemExit("matrix_evidence_missing")
          with results.open("r", encoding="utf-8", newline="") as handle:
              rows = list(csv.DictReader(handle))
          if len(rows) != 104:
              raise SystemExit(f"matrix_row_count_mismatch:{len(rows)}")
          payload = json.loads(summary.read_text(encoding="utf-8"))
          if payload.get("contexts") != 104 or payload.get("datasets") != 26:
              raise SystemExit(f"matrix_summary_mismatch:{payload}")
          print("MATRIX COMPLETE: 104 contexts / 26 datasets. STOP.", flush=True)
          PY

      - name: Upload recovered campaign evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nova-broader-campaign-safe-evidence
          path: |
            data/research/universe_v2/manifest.json
            data/research/broader_matrix_results.csv
            data/research/broader_matrix_summary.json
            data/research/broader_matrix_report.md
          if-no-files-found: warn
          retention-days: 14
