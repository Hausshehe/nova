name: Relative Value Frozen Test

on:
  workflow_dispatch:

concurrency:
  group: nova-relative-value-frozen-test
  cancel-in-progress: false

jobs:
  research:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      actions: read
      contents: read
    env:
      SOURCE_RUN_ID: "32293018258"
      EXPERIMENT_REF: "relative-value-frozen-test"

    steps:
      - name: Checkout frozen experiment branch
        uses: actions/checkout@v4
        with:
          ref: ${{ env.EXPERIMENT_REF }}
          clean: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install research dependencies
        run: python -m pip install --disable-pip-version-check requests pytest

      - name: Download frozen source datasets
        uses: actions/download-artifact@v4
        with:
          run-id: ${{ env.SOURCE_RUN_ID }}
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          pattern: frozen-*
          path: data/research/universe_v2
          merge-multiple: true

      - name: Recover only the known missing datasets
        env:
          RECOVERY_SOURCE_RUN_ID: ${{ env.SOURCE_RUN_ID }}
        run: |
          python -m trading_research.recover_wti_yahoo
          python - <<'PY'
          from pathlib import Path
          from tempfile import NamedTemporaryFile
          from trading_research.dukascopy_history import DukascopyClient, write_csv

          root = Path("data/research/universe_v2")
          missing = [("NAS100", "4H"), ("NZDUSD", "4H"), ("US500", "4H")]
          for instrument, timeframe in missing:
              target = root / f"{instrument}_{timeframe}.csv"
              if target.exists():
                  continue
              candles = DukascopyClient().historical_prices(
                  instrument=instrument,
                  timeframe=timeframe,
                  start_utc="2010-01-01T00:00:00+00:00",
                  end_utc="2025-12-31T23:59:59+00:00",
              )
              if len(candles) < 100:
                  raise SystemExit(f"recovery_insufficient:{instrument}:{timeframe}:{len(candles)}")
              with NamedTemporaryFile(prefix=f".{target.name}.", suffix=".tmp", dir=root, delete=False) as temp:
                  temp_path = Path(temp.name)
              try:
                  write_csv(candles, temp_path)
                  temp_path.replace(target)
              finally:
                  temp_path.unlink(missing_ok=True)
              print(f"RECOVERED {instrument} {timeframe} bars={len(candles)}")
          PY

      - name: Verify complete frozen universe
        run: python -m trading_research.verify_broader_universe

      - name: Validate experiment code
        run: python -m py_compile trading_research/relative_value_frozen_experiment.py

      - name: Run frozen relative-value experiment
        run: python -m trading_research.relative_value_frozen_experiment

      - name: Upload frozen evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nova-relative-value-frozen
          path: |
            data/research/relative_value/summary.json
            data/research/relative_value/results.csv
          if-no-files-found: error
          retention-days: 30
