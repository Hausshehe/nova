name: Fix Mean Reversion Causality

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: trading-research-broader-campaign-run

      - name: Apply causal mean-reversion fix
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path("trading_research/broader_campaign_runner.py")
          text = path.read_text(encoding="utf-8")
          old = '''def mean_reversion_signal_series(bars: Sequence[Bar]) -> list[bool]:
              states = [False] * len(bars)
              in_position = False
              for index in range(len(bars)):
                  if index < 19:
                      continue
                  mean = _sma(bars, index, 20)
                  std = _std_population(bars, index, 20)
                  if not in_position and bars[index].close <= mean - 2.0 * std:
                      in_position = True
                  elif in_position and bars[index].close >= mean:
                      in_position = False
                  states[index] = in_position
              return states
          '''
          new = '''def mean_reversion_signal_series(bars: Sequence[Bar]) -> list[bool]:
              """Causal 20-bar two-sigma mean reversion using prior completed bars only."""
              states = [False] * len(bars)
              in_position = False
              for index in range(len(bars)):
                  if index < 20:
                      continue
                  mean = _sma(bars, index - 1, 20)
                  std = _std_population(bars, index - 1, 20)
                  if not in_position and bars[index].close <= mean - 2.0 * std:
                      in_position = True
                  elif in_position and bars[index].close >= mean:
                      in_position = False
                  states[index] = in_position
              return states
          '''
          if old not in text:
              raise SystemExit("expected mean-reversion implementation not found")
          path.write_text(text.replace(old, new), encoding="utf-8")
          PY

      - name: Run focused tests
        run: |
          python -m pip install --disable-pip-version-check -r requirements-trading-research.txt pytest
          python -m pytest -q tests/test_broader_campaign_runner.py

      - name: Commit fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add trading_research/broader_campaign_runner.py
          git diff --cached --check
          git commit -m "Fix causal mean-reversion signal"
          git push origin HEAD:trading-research-broader-campaign-run
