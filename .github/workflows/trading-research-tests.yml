name: Trading Research Tests

on:
  workflow_dispatch:
  push:
    branches:
      - trading-research-lab
      - trading-research-robustness-audit
      - trading-research-statistical-audit
      - trading-research-hypothesis-disposition
      - trading-research-memory-hardening
      - trading-research-memory-gate
  pull_request:
    branches:
      - trading-research-lab

jobs:
  research-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install test dependencies
        run: python -m pip install --disable-pip-version-check pytest requests
      - name: Compile research package
        run: python -m compileall -q trading_research
      - name: Run test suite
        run: python -m pytest -q

  broader-campaign:
    if: github.event_name == 'push' || (github.event_name == 'pull_request' && github.event.pull_request.head.ref == 'trading-research-broader-campaign-run')
    needs: research-tests
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install research dependencies
        run: python -m pip install --disable-pip-version-check -r requirements-trading-research.txt pytest
      - name: Acquire frozen broader universe
        run: python -m trading_research.download_research_universe
      - name: Run frozen 104-context matrix
        run: python -m trading_research.broader_campaign_runner
      - name: Upload campaign evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nova-broader-campaign-evidence
          if-no-files-found: warn
          path: |
            data/research/universe_v2/manifest.json
            data/research/broader_matrix_results.csv
            data/research/broader_matrix_summary.json
            data/research/broader_matrix_report.md
