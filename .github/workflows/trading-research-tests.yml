name: Trading Research Tests

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - trading-research-lab
  pull_request:
    branches:
      - main
      - trading-research-lab

jobs:
  research-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install test dependencies
        run: python -m pip install --disable-pip-version-check pytest requests
      - name: Compile changed research modules
        run: >-
          python -m py_compile
          trading_research/adaptive_opportunity_policy.py
          trading_research/strategy_escalation_efficiency.py
      - name: Run test suite
        run: python -m pytest -q
