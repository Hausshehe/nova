name: Trading Research Tests

on:
  workflow_dispatch:
  push:
    branches:
      - trading-research-lab
      - trading-research-robustness-audit
      - trading-research-statistical-audit
      - trading-research-hypothesis-disposition
      - trading-research-memory-hardening
      - trading-research-memory-gate
  pull_request:
    branches:
      - trading-research-lab

jobs:
  research-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install test dependencies
        run: python -m pip install --disable-pip-version-check pytest requests
      - name: Compile research package
        run: python -m compileall -q trading_research
      - name: Run test suite
        run: python -m pytest -q
