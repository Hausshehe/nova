name: Experiment 2 Development Benchmark

on:
  workflow_dispatch:

jobs:
  benchmark:
    runs-on: ubuntu-latest
    timeout-minutes: 240
    permissions:
      actions: read
      contents: read

    steps:
      - name: Checkout benchmark branch
        uses: actions/checkout@v4
        with:
          ref: experiment-2-development-benchmark
          clean: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install benchmark dependencies
        run: python -m pip install --disable-pip-version-check pytest scikit-learn requests yfinance pandas

      - name: Run Experiment 2 unit tests
        run: python -m pytest -q tests/test_experiment2.py

      - name: Compile Experiment 2 modules
        run: |
          python -m py_compile trading_research/experiment2_development_benchmark.py
          python -m py_compile trading_research/experiment2_recover_missing_4h.py

      - name: Download reusable source artifacts
        uses: actions/download-artifact@v4
        with:
          run-id: 32293018258
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          pattern: frozen-*
          path: data/research/universe_v2
          merge-multiple: true

      - name: Build independent WTI daily dataset from Yahoo Finance
        run: |
          python - <<'PY'
          from pathlib import Path
          import pandas as pd
          import yfinance as yf
          target = Path('data/research/universe_v2/WTI_1D.csv')
          target.parent.mkdir(parents=True, exist_ok=True)
          frame = yf.download('CL=F', start='2010-01-01', end='2026-01-01', interval='1d', auto_adjust=False, progress=False, threads=False)
          if frame is None or frame.empty:
              raise SystemExit('yahoo_wti_daily_empty')
          if isinstance(frame.columns, pd.MultiIndex):
              frame.columns = frame.columns.get_level_values(0)
          required = ['Open', 'High', 'Low', 'Close', 'Volume']
          if any(c not in frame.columns for c in required):
              raise SystemExit('yahoo_wti_columns_missing')
          frame = frame[required].dropna()
          frame.index = pd.to_datetime(frame.index, utc=True).normalize()
          frame = frame[~frame.index.duplicated(keep='last')].sort_index()
          if set(range(2010, 2026)) - set(frame.index.year):
              raise SystemExit(f'yahoo_wti_missing_years:{sorted(set(range(2010, 2026))-set(frame.index.year))}')
          out = pd.DataFrame({'timestamp': frame.index.astype(str), 'open': frame.Open.astype(float), 'high': frame.High.astype(float), 'low': frame.Low.astype(float), 'close': frame.Close.astype(float), 'volume': frame.Volume.fillna(0).astype(float)})
          for row in out.itertuples(index=False):
              if not (row.low <= row.open <= row.high and row.low <= row.close <= row.high):
                  raise SystemExit(f'yahoo_wti_invalid_ohlc:{row.timestamp}')
          out.to_csv(target, index=False)
          print(f'YAHOO WTI 1D COMPLETE bars={len(out)}')
          PY

      - name: Recover missing 4H datasets with deterministic source splices
        run: python -m trading_research.experiment2_recover_missing_4h

      - name: Validate exact 26-dataset development universe
        run: |
          python - <<'PY'
          from pathlib import Path
          from trading_research.data import load_csv
          from trading_research.dukascopy_history import INSTRUMENTS, TIMEFRAMES
          root = Path('data/research/universe_v2')
          expected = {(i,t) for i in INSTRUMENTS for t in TIMEFRAMES}
          missing = {(i,t) for i,t in expected if not (root / f'{i}_{t}.csv').is_file()}
          if missing:
              raise SystemExit(f'missing_datasets:{sorted(missing)}')
          for instrument, timeframe in sorted(expected):
              bars = load_csv(root / f'{instrument}_{timeframe}.csv')
              years = {bar.timestamp.year for bar in bars}
              if years != set(range(2010, 2026)):
                  raise SystemExit(f'coverage_failure:{instrument}:{timeframe}:{sorted(set(range(2010, 2026))-years)}')
          print('DEVELOPMENT DATASET PASS: 26/26')
          PY

      - name: Run pre-test development benchmark
        run: python -m trading_research.experiment2_development_benchmark

      - name: Assert development evidence only
        run: |
          python - <<'PY'
          import csv, json
          from pathlib import Path
          root = Path('data/research/experiment2_development')
          results, summary, report = root/'experiment2_development_results.csv', root/'experiment2_development_summary.json', root/'experiment2_development_report.md'
          if not results.is_file() or not summary.is_file() or not report.is_file():
              raise SystemExit('development_evidence_missing')
          with results.open('r', encoding='utf-8', newline='') as f:
              rows = list(csv.DictReader(f))
          payload = json.loads(summary.read_text(encoding='utf-8'))
          if len(rows) != 78:
              raise SystemExit(f'development_row_count_mismatch:{len(rows)}')
          if payload.get('contexts_evaluated') != 26 or payload.get('folds_per_context') != 3:
              raise SystemExit(f'development_summary_mismatch:{payload}')
          if payload.get('final_test_used') is not False:
              raise SystemExit('FINAL_TEST_MUST_REMAIN_UNTOUCHED')
          print('DEVELOPMENT EVIDENCE COMPLETE: 26 contexts / 78 fold results / final test untouched')
          PY

      - name: Upload development evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nova-experiment2-development-benchmark
          path: data/research/experiment2_development/
          if-no-files-found: error
          retention-days: 14
