name: Android Control Unit Tests

on:
  push:
    branches:
      - android-control-v2
  workflow_dispatch:

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install test dependencies
        run: python -m pip install --disable-pip-version-check requests
      - name: Run Android-control tests
        run: python -m unittest tests.test_android_action_fallbacks -v
