name: Context Intelligence Benchmark

on:
  workflow_dispatch:

jobs:
  benchmark:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    permissions:
      actions: read
      contents: read
    env:
      SOURCE_RUN_ID: "32293018258"
      EXPERIMENT_REF: "context-intelligence-feasibility"

    steps:
      - name: Checkout experiment branch
        uses: actions/checkout@v4
        with:
          ref: ${{ env.EXPERIMENT_REF }}
          clean: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: python -m pip install --disable-pip-version-check requests pytest

      - name: Download frozen source datasets
        uses: actions/download-artifact@v4
        with:
          run-id: ${{ env.SOURCE_RUN_ID }}
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          pattern: frozen-*
          path: data/research/universe_v2
          merge-multiple: true

      - name: Verify source snapshot and recover only the known missing datasets
        env:
          RECOVERY_SOURCE_RUN_ID: ${{ env.SOURCE_RUN_ID }}
        run: |
          python - <<'PY'
          import os
          from pathlib import Path
          from tempfile import NamedTemporaryFile
          from trading_research.data import INSTRUMENTS, TIMEFRAMES, load_csv
          from trading_research.dukascopy_history import DukascopyClient, write_csv

          root = Path("data/research/universe_v2")
          source_run = os.environ["RECOVERY_SOURCE_RUN_ID"]
          expected_missing_before_recovery = {
              ("NAS100", "4H"), ("NZDUSD", "4H"), ("US500", "4H"), ("WTI", "1D")
          }
          missing = {
              (instrument, timeframe)
              for instrument in INSTRUMENTS
              for timeframe in TIMEFRAMES
              if not (root / f"{instrument}_{timeframe}.csv").is_file()
          }
          if source_run == "32293018258" and missing != expected_missing_before_recovery:
              raise SystemExit(f"source_snapshot_mismatch:{sorted(missing)}")

          for path in root.glob("*.csv"):
              bars = load_csv(path)
              if len(bars) < 100:
                  raise SystemExit(f"invalid_source_dataset:{path.name}:{len(bars)}")
          print(f"SOURCE FROZEN SNAPSHOT VERIFIED existing={26-len(missing)} missing={sorted(missing)}")

          # Reconstruct the exact recovery procedure used by the frozen campaign:
          # WTI 1D from the pinned Yahoo source, then the remaining three datasets
          # from the same pinned Dukascopy acquisition code.
          PY
          python -m trading_research.recover_wti_yahoo
          python - <<'PY'
          from pathlib import Path
          from trading_research.data import load_csv
          p = Path("data/research/universe_v2/WTI_1D.csv")
          if not p.is_file():
              raise SystemExit("WTI_1D_RECOVERY_MISSING")
          bars = load_csv(p)
          if len(bars) < 100:
              raise SystemExit(f"WTI_1D_RECOVERY_INVALID:{len(bars)}")
          print(f"WTI_1D_RECOVERED bars={len(bars)}")
          PY
          python - <<'PY'
          from pathlib import Path
          from tempfile import NamedTemporaryFile
          from trading_research.dukascopy_history import DukascopyClient, write_csv

          root = Path("data/research/universe_v2")
          missing = [("NAS100", "4H"), ("NZDUSD", "4H"), ("US500", "4H")]
          for instrument, timeframe in missing:
              target = root / f"{instrument}_{timeframe}.csv"
              if target.exists():
                  continue
              candles = DukascopyClient().historical_prices(
                  instrument=instrument,
                  timeframe=timeframe,
                  start_utc="2010-01-01T00:00:00+00:00",
                  end_utc="2025-12-31T23:59:59+00:00",
              )
              if len(candles) < 100:
                  raise SystemExit(f"recovery_insufficient:{instrument}:{timeframe}:{len(candles)}")
              with NamedTemporaryFile(prefix=f".{target.name}.", suffix=".tmp", dir=root, delete=False) as temp:
                  temp_path = Path(temp.name)
              try:
                  write_csv(candles, temp_path)
                  temp_path.replace(target)
              finally:
                  temp_path.unlink(missing_ok=True)
              print(f"RECOVERED {instrument} {timeframe} bars={len(candles)}")
          PY

      - name: Verify complete frozen universe
        run: python -m trading_research.verify_broader_universe

      - name: Validate benchmark code
        run: python -m py_compile trading_research/context_intelligence_benchmark.py

      - name: Run causal context benchmark
        run: python -m trading_research.context_intelligence_benchmark

      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nova-context-intelligence-benchmark
          path: data/research/context_intelligence_benchmark.json
          if-no-files-found: error
          retention-days: 30
