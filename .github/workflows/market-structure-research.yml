name: Market Structure Research

on:
  workflow_dispatch:

jobs:
  research:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    permissions:
      contents: read
    steps:
      - name: Checkout experiment branch
        uses: actions/checkout@v4
        with:
          ref: market-structure-research
          clean: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: python -m pip install --disable-pip-version-check requests pytest

      - name: Validate experiment code
        run: python -m py_compile trading_research/market_structure_rejection_experiment.py

      - name: Run frozen market-structure experiment
        run: python -m trading_research.market_structure_rejection_experiment

      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nova-market-structure-research
          path: data/research/market_structure_rejection/summary.json
          if-no-files-found: error
          retention-days: 30
