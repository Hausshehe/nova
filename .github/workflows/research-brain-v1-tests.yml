name: Researcher v1 Tests

on:
  workflow_dispatch:
  push:
    branches:
      - research-brain-v1
      - research-brain-development-integration
  pull_request:
    branches:
      - research-brain-v1

jobs:
  test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout proposed revision
        uses: actions/checkout@v4
        with:
          clean: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install test dependencies
        run: python -m pip install --disable-pip-version-check pytest requests

      - name: Compile Researcher v1 and development runner
        run: |
          python -m py_compile trading_research/research_brain.py
          python -m py_compile trading_research/regime_conditioned_research.py
          python -m py_compile tools/run_research_brain_development.py

      - name: Run focused Research Brain tests
        run: |
          python -m pytest -q \
            tests/test_research_brain.py \
            tests/test_regime_conditioned_research.py \
            tests/test_research_brain_development_runner.py
