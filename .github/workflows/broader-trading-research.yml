name: Broader Trading Research Campaign

on:
  push:
    branches:
      - trading-research-broader-campaign-run
  workflow_dispatch:

jobs:
  broader-campaign:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install research dependencies
        run: python -m pip install --disable-pip-version-check -r requirements-trading-research.txt pytest

      - name: Compile research package
        run: python -m compileall -q trading_research

      - name: Run full test suite
        run: python -m pytest -q

      - name: Acquire frozen broader universe
        run: python -m trading_research.download_research_universe

      - name: Run frozen 104-context matrix
        run: python -m trading_research.broader_campaign_runner

      - name: Upload campaign evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nova-broader-campaign-evidence
          if-no-files-found: warn
          path: |
            data/research/universe_v2/manifest.json
            data/research/broader_matrix_results.csv
            data/research/broader_matrix_summary.json
            data/research/broader_matrix_report.md
