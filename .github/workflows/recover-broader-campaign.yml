name: Recover Broader Trading Research Campaign

on:
  workflow_dispatch:
    inputs:
      source_run_id:
        description: "Frozen failed campaign run"
        required: true
        type: string
      recovery_commit:
        description: "Reviewed recovery commit"
        required: true
        type: string

concurrency:
  group: nova-broader-campaign-recovery
  cancel-in-progress: false

jobs:
  recover:
    runs-on: ubuntu-latest
    timeout-minutes: 240
    permissions:
      actions: read
      contents: read
    env:
      SOURCE_RUN_ID: ${{ inputs.source_run_id }}
      RECOVERY_COMMIT: ${{ inputs.recovery_commit }}

    steps:
      - name: Resolve source run and recovery commit
        id: resolve
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python - <<'PY'
          import json
          import os
          import urllib.request

          repo = os.environ["GITHUB_REPOSITORY"]
          run_id = os.environ["SOURCE_RUN_ID"].strip()
          recovery_commit = os.environ["RECOVERY_COMMIT"].strip()
          if not run_id:
              raise SystemExit("source_run_id_required")
          if not recovery_commit:
              raise SystemExit("recovery_commit_required")

          def github_get(url: str) -> dict:
              request = urllib.request.Request(
                  url,
                  headers={
                      "Accept": "application/vnd.github+json",
                      "Authorization": f"Bearer {os.environ['GH_TOKEN']}",
                      "X-GitHub-Api-Version": "2022-11-28",
                  },
              )
              with urllib.request.urlopen(request, timeout=30) as response:
                  return json.load(response)

          run = github_get(f"https://api.github.com/repos/{repo}/actions/runs/{run_id}")
          if run.get("repository", {}).get("full_name") != repo:
              raise SystemExit("source_run_repository_mismatch")
          if run.get("status") != "completed":
              raise SystemExit(f"source_run_not_completed:{run.get('status')}")
          if run.get("conclusion") not in {"failure", "cancelled"}:
              raise SystemExit(f"source_run_unexpected_conclusion:{run.get('conclusion')}")
          head_sha = run.get("head_sha")
          if not head_sha:
              raise SystemExit("source_run_missing_head_sha")
          if run_id == "32293018258" and head_sha != "d79afc0e463be97a419e20bde348650cdb55c945":
              raise SystemExit(f"frozen_source_head_mismatch:{head_sha}")

          recovery = github_get(f"https://api.github.com/repos/{repo}/commits/{recovery_commit}")
          if recovery.get("sha") != recovery_commit:
              raise SystemExit("recovery_commit_not_found_or_mismatched")

          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as output:
              output.write(f"recovery_sha={recovery_commit}\n")
          print(
              f"SOURCE RUN VERIFIED id={run_id} status={run.get('status')} "
              f"conclusion={run.get('conclusion')} run_head_sha={head_sha} "
              f"recovery_commit={recovery_commit}",
              flush=True,
          )
          PY

      - name: Checkout reviewed recovery commit
        uses: actions/checkout@v4
        with:
          ref: ${{ steps.resolve.outputs.recovery_sha }}
          clean: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install research dependencies
        run: python -m pip install --disable-pip-version-check pytest requests

      - name: Verify recovery code is present
        run: |
          test -f trading_research/dukascopy_history.py
          test -f trading_research/broader_campaign_runner.py
          test -f tests/test_dukascopy_recovery_from_frozen.py

      - name: Download successful frozen datasets from source run
        uses: actions/download-artifact@v4
        with:
          run-id: ${{ env.SOURCE_RUN_ID }}
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          pattern: frozen-*
          path: data/research/universe_v2
          merge-multiple: true

      - name: Verify exact source artifact snapshot before migration
        run: |
          python - <<'PY'
          from pathlib import Path
          from trading_research.data import load_csv
          from trading_research.dukascopy_history import INSTRUMENTS, TIMEFRAMES

          root = Path("data/research/universe_v2")
          expected_missing = {("NAS100", "4H"), ("NZDUSD", "4H"), ("US500", "4H"), ("WTI", "1D"), ("WTI", "4H")}
          missing = set()
          for instrument in INSTRUMENTS:
              for timeframe in TIMEFRAMES:
                  path = root / f"{instrument}_{timeframe}.csv"
                  if not path.is_file():
                      missing.add((instrument, timeframe))
                      continue
                  bars = load_csv(path)
                  years = {bar.timestamp.year for bar in bars}
                  if not years:
                      raise SystemExit(f"source_calendar_coverage_failure:{instrument}:{timeframe}:no_bars")
                  first_year = min(years)
                  last_year = max(years)
                  expected_years = set(range(first_year, 2026))
                  if first_year < 2010 or last_year != 2025 or years != expected_years:
                      raise SystemExit(f"source_calendar_coverage_failure:{instrument}:{timeframe}")
          if missing != expected_missing:
              raise SystemExit(f"source_snapshot_mismatch:{sorted(missing)}")
          print(f"SOURCE SNAPSHOT PASS reused={26-len(missing)} rebuild={sorted(missing)}")
          PY

      - name: Invalidate legacy WTI 4H artifact when required
        run: |
          python - <<'PY'
          from trading_research.migrate_legacy_broader_artifacts import invalidate_legacy_wti_4h
          removed = invalidate_legacy_wti_4h("data/research/universe_v2", source_run_id=os.environ["SOURCE_RUN_ID"])
          print(f"INVALIDATED {removed}")
          PY
        env:
          SOURCE_RUN_ID: ${{ env.SOURCE_RUN_ID }}

      - name: Recover only missing frozen datasets
        run: |
          python -m trading_research.rebuild_recovery_manifest

      - name: Rebuild deterministic frozen manifest
        run: python -m trading_research.rebuild_recovery_manifest

      - name: Verify frozen universe
        run: python -m trading_research.verify_broader_universe

      - name: Run frozen 104-context matrix
        run: python -m trading_research.broader_campaign_runner

      - name: Upload recovered campaign evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nova-broader-campaign-recovered-evidence
          path: |
            data/research/universe_v2/manifest.json
            data/research/broader_matrix_results.csv
            data/research/broader_matrix_summary.json
            data/research/broader_matrix_report.md
          if-no-files-found: warn
          retention-days: 14
