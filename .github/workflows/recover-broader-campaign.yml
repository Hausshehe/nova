name: Recover Broader Trading Research Campaign

on:
  workflow_dispatch:
    inputs:
      source_run_id:
        description: "Failed broader campaign run whose successful frozen dataset artifacts should be reused"
        required: true
        type: string
      recovery_commit:
        description: "Reviewed code commit to run recovery"
        required: true
        type: string

jobs:
  recover:
    runs-on: ubuntu-latest
    timeout-minutes: 240
    permissions:
      actions: read
      contents: read
    env:
      SOURCE_RUN_ID: ${{ inputs.source_run_id }}
      RECOVERY_COMMIT: ${{ inputs.recovery_commit }}

    steps:
      - name: Resolve source run and recovery commit
        id: source
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python - <<'PY'
          import json
          import os
          import urllib.request

          repo = os.environ["GITHUB_REPOSITORY"]
          run_id = os.environ["SOURCE_RUN_ID"].strip()
          recovery_commit = os.environ["RECOVERY_COMMIT"].strip()
          if not run_id:
              raise SystemExit("source_run_id_required")
          if not recovery_commit:
              raise SystemExit("recovery_commit_required")

          def github_get(url: str) -> dict:
              request = urllib.request.Request(
                  url,
                  headers={
                      "Accept": "application/vnd.github+json",
                      "Authorization": f"Bearer {os.environ['GH_TOKEN']}",
                      "X-GitHub-Api-Version": "2022-11-28",
                  },
              )
              with urllib.request.urlopen(request, timeout=30) as response:
                  return json.load(response)

          run = github_get(f"https://api.github.com/repos/{repo}/actions/runs/{run_id}")

          if run.get("repository", {}).get("full_name") != repo:
              raise SystemExit("source_run_repository_mismatch")
          if run.get("status") != "completed":
              raise SystemExit(f"source_run_not_completed:{run.get('status')}")
          if run.get("conclusion") not in {"failure", "cancelled"}:
              raise SystemExit(f"source_run_unexpected_conclusion:{run.get('conclusion')}")
          head_sha = run.get("head_sha")
          if not head_sha:
              raise SystemExit("source_run_missing_head_sha")

          # Source run 32293018258 is the frozen broader-campaign acquisition snapshot.
          if run_id == "32293018258" and head_sha != "d79afc0e463be97a419e20bde348650cdb55c945":
              raise SystemExit(f"frozen_source_head_mismatch:{head_sha}")

          recovery = github_get(f"https://api.github.com/repos/{repo}/commits/{recovery_commit}")
          resolved_sha = recovery.get("sha")
          if resolved_sha != recovery_commit:
              raise SystemExit("recovery_commit_not_found_or_mismatched")

          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as output:
              output.write(f"recovery_sha={recovery_commit}\n")
          print(
              f"SOURCE RUN VERIFIED id={run_id} status={run.get('status')} conclusion={run.get('conclusion')} "
              f"run_head_sha={head_sha} recovery_commit={recovery_commit}",
              flush=True,
          )
          PY

      - name: Checkout reviewed recovery commit
        uses: actions/checkout@v4
        with:
          ref: ${{ steps.source.outputs.recovery_sha }}

      - name: Verify recovery code is present
        run: |
          test -f trading_research/dukascopy_history.py
          test -f trading_research/migrate_legacy_broader_artifacts.py
          python - <<'PY'
          from trading_research.migrate_legacy_broader_artifacts import (
              LEGACY_SOURCE_RUN_ID,
              LEGACY_WTI_4H_DATASET,
              invalidate_legacy_wti_4h,
          )
          print(
              f"RECOVERY CODE VERIFIED legacy_source_run={LEGACY_SOURCE_RUN_ID} "
              f"legacy_wti_4h={LEGACY_WTI_4H_DATASET} "
              f"migration={invalidate_legacy_wti_4h.__name__}",
              flush=True,
          )
          PY

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install research dependencies
        run: python -m pip install --disable-pip-version-check -r requirements-trading-research.txt pytest

      - name: Download successful frozen datasets from source run
        uses: actions/download-artifact@v4
        with:
          run-id: ${{ inputs.source_run_id }}
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          pattern: frozen-*
          path: data/research/universe_v2
          merge-multiple: true

      - name: Invalidate legacy WTI 4H artifact when required
        env:
          MIGRATION_SOURCE_RUN_ID: ${{ inputs.source_run_id }}
        run: |
          python - <<'PY'
          import os
          from trading_research.migrate_legacy_broader_artifacts import (
              LEGACY_SOURCE_RUN_ID,
              LEGACY_WTI_4H_DATASET,
              invalidate_legacy_wti_4h,
          )

          source_run_id = os.environ["MIGRATION_SOURCE_RUN_ID"].strip()
          if source_run_id != LEGACY_SOURCE_RUN_ID:
              print(f"LEGACY WTI 4H INVALIDATION SKIPPED source_run={source_run_id}", flush=True)
          else:
              removed = invalidate_legacy_wti_4h(
                  "data/research/universe_v2",
                  source_run_id=source_run_id,
              )
              if removed != LEGACY_WTI_4H_DATASET:
                  raise SystemExit(f"legacy_wti_4h_invalidation_mismatch:{removed}")
              print(f"LEGACY WTI 4H INVALIDATED dataset={removed}", flush=True)
          PY

      - name: Recover only missing frozen datasets
        env:
          RECOVERY_SOURCE_RUN_ID: ${{ inputs.source_run_id }}
        run: |
          python - <<'PY'
          import os
          from pathlib import Path
          from trading_research.dukascopy_history import (
              DukascopyClient,
              INSTRUMENTS,
              TIMEFRAMES,
              write_csv,
          )

          source_run_id = os.environ["RECOVERY_SOURCE_RUN_ID"].strip()
          root = Path("data/research/universe_v2")
          root.mkdir(parents=True, exist_ok=True)
          missing = [
              (instrument, timeframe)
              for instrument in INSTRUMENTS
              for timeframe in TIMEFRAMES
              if not (root / f"{instrument}_{timeframe}.csv").is_file()
          ]

          expected_legacy_missing = {
              ("NAS100", "4H"),
              ("NZDUSD", "4H"),
              ("US500", "4H"),
              ("WTI", "1D"),
              ("WTI", "4H"),
          }
          if source_run_id == "32293018258" and set(missing) != expected_legacy_missing:
              raise SystemExit(f"legacy_missing_snapshot_mismatch:{sorted(missing)}")

          print(
              f"REUSE existing frozen datasets={len(INSTRUMENTS) * len(TIMEFRAMES) - len(missing)}",
              flush=True,
          )
          print(f"RECOVER missing datasets={len(missing)}", flush=True)

          for instrument, timeframe in missing:
              recovered = False
              for attempt in range(1, 4):
                  print(
                      f"RECOVERY attempt={attempt}/3 dataset={instrument} {timeframe}",
                      flush=True,
                  )
                  try:
                      client = DukascopyClient()
                      candles = client.historical_prices(
                          instrument=instrument,
                          timeframe=timeframe,
                          start_utc="2010-01-01T00:00:00+00:00",
                          end_utc="2025-12-31T23:59:59+00:00",
                      )
                      if len(candles) < 100:
                          raise RuntimeError(f"insufficient_bars:{len(candles)}")
                      target = root / f"{instrument}_{timeframe}.csv"
                      digest = write_csv(candles, target)
                      print(
                          f"RECOVERY COMPLETE dataset={instrument} {timeframe} "
                          f"bars={len(candles)} sha256={digest}",
                          flush=True,
                      )
                      recovered = True
                      break
                  except Exception as exc:
                      print(
                          f"RECOVERY FAILED attempt={attempt}/3 dataset={instrument} {timeframe} "
                          f"error={type(exc).__name__}: {exc}",
                          flush=True,
                      )
              if not recovered:
                  raise SystemExit(f"recovery_exhausted:{instrument}:{timeframe}")
          PY

      - name: Verify frozen universe
        run: python -m trading_research.verify_broader_universe

      - name: Run frozen 104-context matrix
        run: python -m trading_research.broader_campaign_runner

      - name: Upload recovered campaign evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nova-broader-campaign-recovered-evidence
          path: |
            data/research/universe_v2/manifest.json
            data/research/broader_matrix_results.csv
            data/research/broader_matrix_summary.json
            data/research/broader_matrix_report.md
          if-no-files-found: error
          retention-days: 14
