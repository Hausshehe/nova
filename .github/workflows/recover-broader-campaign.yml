name: Recover Broader Trading Research Campaign

on:
  workflow_dispatch:
    inputs:
      source_run_id:
        description: "Failed broader campaign run whose successful frozen dataset artifacts should be reused"
        required: true
        type: string
      source_commit:
        description: "Optional frozen research commit to use instead of the source run head; use only for infrastructure-only recovery fixes"
        required: false
        default: ""
        type: string

jobs:
  recover:
    runs-on: ubuntu-latest
    timeout-minutes: 240
    permissions:
      actions: read
      contents: read
    env:
      SOURCE_RUN_ID: ${{ inputs.source_run_id }}
      SOURCE_COMMIT: ${{ inputs.source_commit }}

    steps:
      - name: Resolve source run commit
        id: source
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python - <<'PY'
          import json
          import os
          import urllib.request

          repo = os.environ["GITHUB_REPOSITORY"]
          run_id = os.environ["SOURCE_RUN_ID"]
          override = os.environ.get("SOURCE_COMMIT", "").strip()
          request = urllib.request.Request(
              f"https://api.github.com/repos/{repo}/actions/runs/{run_id}",
              headers={
                  "Accept": "application/vnd.github+json",
                  "Authorization": f"Bearer {os.environ['GH_TOKEN']}",
                  "X-GitHub-Api-Version": "2022-11-28",
              },
          )
          with urllib.request.urlopen(request, timeout=30) as response:
              run = json.load(response)

          if run.get("repository", {}).get("full_name") != repo:
              raise SystemExit("source_run_repository_mismatch")
          head_sha = run.get("head_sha")
          if not head_sha:
              raise SystemExit("source_run_missing_head_sha")

          selected_sha = override or head_sha
          if override:
              commit_request = urllib.request.Request(
                  f"https://api.github.com/repos/{repo}/commits/{override}",
                  headers={
                      "Accept": "application/vnd.github+json",
                      "Authorization": f"Bearer {os.environ['GH_TOKEN']}",
                      "X-GitHub-Api-Version": "2022-11-28",
                  },
              )
              with urllib.request.urlopen(commit_request, timeout=30) as response:
                  commit = json.load(response)
              resolved_sha = commit.get("sha")
              if resolved_sha != override:
                  raise SystemExit("source_commit_not_found_or_mismatched")

          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as output:
              output.write(f"head_sha={selected_sha}\n")
          print(
              f"SOURCE RUN id={run_id} status={run.get('status')} conclusion={run.get('conclusion')} "
              f"run_head_sha={head_sha} selected_commit={selected_sha} override={'yes' if override else 'no'}",
              flush=True,
          )
          PY

      - name: Checkout source run commit
        uses: actions/checkout@v4
        with:
          ref: ${{ steps.source.outputs.head_sha }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install research dependencies
        run: python -m pip install --disable-pip-version-check -r requirements-trading-research.txt pytest

      - name: Download successful frozen datasets from source run
        uses: actions/download-artifact@v4
        with:
          run-id: ${{ inputs.source_run_id }}
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          pattern: frozen-*
          path: data/research/universe_v2
          merge-multiple: true

      - name: Migrate legacy decoder artifacts
        run: |
          python - <<'PY'
          from trading_research.migrate_legacy_broader_artifacts import LEGACY_SOURCE_RUN_ID, migrate_legacy_artifacts

          source_run_id = "${{ inputs.source_run_id }}"
          if source_run_id != LEGACY_SOURCE_RUN_ID:
              raise SystemExit(f"legacy_migration_required_for_known_source_only:{source_run_id}")

          repaired_daily, removed_four_hour = migrate_legacy_artifacts(
              "data/research/universe_v2",
              source_run_id=source_run_id,
          )
          expected_daily = 12
          expected_four_hour = 13
          if len(repaired_daily) != expected_daily:
              raise SystemExit(
                  f"legacy_daily_migration_count_mismatch:{len(repaired_daily)}:{expected_daily}"
              )
          if len(removed_four_hour) != expected_four_hour:
              raise SystemExit(
                  f"legacy_four_hour_removal_count_mismatch:{len(removed_four_hour)}:{expected_four_hour}"
              )
          print(
              f"LEGACY MIGRATION COMPLETE repaired_daily={len(repaired_daily)} "
              f"removed_four_hour={len(removed_four_hour)}",
              flush=True,
          )
          PY

      - name: Recover only missing frozen datasets
        run: |
          python - <<'PY'
          from pathlib import Path
          from trading_research.dukascopy_history import DukascopyClient, INSTRUMENTS, TIMEFRAMES, write_csv

          root = Path("data/research/universe_v2")
          root.mkdir(parents=True, exist_ok=True)
          missing = [
              (instrument, timeframe)
              for instrument in INSTRUMENTS
              for timeframe in TIMEFRAMES
              if not (root / f"{instrument}_{timeframe}.csv").is_file()
          ]

          print(f"REUSE existing frozen datasets={len(INSTRUMENTS) * len(TIMEFRAMES) - len(missing)}", flush=True)
          print(f"RECOVER missing datasets={len(missing)}", flush=True)

          for instrument, timeframe in missing:
              recovered = False
              for attempt in range(1, 4):
                  print(f"RECOVERY attempt={attempt}/3 dataset={instrument} {timeframe}", flush=True)
                  try:
                      client = DukascopyClient()
                      candles = client.historical_prices(
                          instrument=instrument,
                          timeframe=timeframe,
                          start_utc="2010-01-01T00:00:00+00:00",
                          end_utc="2025-12-31T23:59:59+00:00",
                          progress=lambda message: print(message, flush=True),
                      )
                      if len(candles) < 100:
                          raise RuntimeError(f"insufficient_bars:{len(candles)}")
                      target = root / f"{instrument}_{timeframe}.csv"
                      digest = write_csv(candles, target)
                      print(
                          f"RECOVERY COMPLETE dataset={instrument} {timeframe} "
                          f"bars={len(candles)} sha256={digest}",
                          flush=True,
                      )
                      recovered = True
                      break
                  except Exception as exc:
                      print(
                          f"RECOVERY FAILED attempt={attempt}/3 dataset={instrument} {timeframe} "
                          f"error={type(exc).__name__}: {exc}",
                          flush=True,
                      )
              if not recovered:
                  raise SystemExit(f"recovery_exhausted:{instrument}:{timeframe}")
          PY

      - name: Verify frozen universe
        run: python -m trading_research.verify_broader_universe

      - name: Run frozen 104-context matrix
        run: python -m trading_research.broader_campaign_runner

      - name: Upload recovered campaign evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nova-broader-campaign-recovered-evidence
          path: |
            data/research/universe_v2/manifest.json
            data/research/broader_matrix_results.csv
            data/research/broader_matrix_summary.json
            data/research/broader_matrix_report.md
          if-no-files-found: error
          retention-days: 14
