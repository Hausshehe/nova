name: Run Broader Trading Research Replication (INDEPENDENT WTI DAILY)

on:
  workflow_dispatch:
    inputs:
      source_run_id:
        description: "Successful frozen-dataset source workflow run ID"
        required: true
        type: string
      research_commit:
        description: "Reviewed research commit to replicate"
        required: true
        type: string

concurrency:
  group: nova-broader-campaign-recovery
  cancel-in-progress: false

jobs:
  replicate:
    runs-on: ubuntu-latest
    timeout-minutes: 240
    permissions:
      actions: read
      contents: read

    steps:
      - name: Resolve and verify source inputs
        id: source
        env:
          SOURCE_RUN_ID: ${{ inputs.source_run_id }}
          RESEARCH_COMMIT: ${{ inputs.research_commit }}
          GH_TOKEN: ${{ github.token }}
        run: |
          python - <<'PY'
          import json
          import os
          import urllib.request

          repo = os.environ["GITHUB_REPOSITORY"]
          run_id = os.environ["SOURCE_RUN_ID"].strip()
          commit = os.environ["RESEARCH_COMMIT"].strip()
          if not run_id or not commit:
              raise SystemExit("source_run_id_and_research_commit_required")

          def get_json(url: str) -> dict:
              req = urllib.request.Request(
                  url,
                  headers={
                      "Accept": "application/vnd.github+json",
                      "Authorization": f"Bearer {os.environ['GH_TOKEN']}",
                      "X-GitHub-Api-Version": "2022-11-28",
                  },
              )
              with urllib.request.urlopen(req, timeout=30) as response:
                  return json.load(response)

          run = get_json(f"https://api.github.com/repos/{repo}/actions/runs/{run_id}")
          if run.get("repository", {}).get("full_name") != repo:
              raise SystemExit("source_run_repository_mismatch")
          if run.get("status") != "completed" or run.get("conclusion") != "success":
              raise SystemExit(f"source_run_not_successful:{run.get('status')}:{run.get('conclusion')}")
          commit_payload = get_json(f"https://api.github.com/repos/{repo}/commits/{commit}")
          if commit_payload.get("sha") != commit:
              raise SystemExit("research_commit_not_found_or_mismatched")
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as output:
              output.write(f"research_sha={commit}\n")
          print(f"SOURCE VERIFIED run={run_id} head_sha={run.get('head_sha')} research_commit={commit}", flush=True)
          PY

      - name: Checkout reviewed research commit
        uses: actions/checkout@v4
        with:
          ref: ${{ steps.source.outputs.research_sha }}
          clean: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install research dependencies
        run: |
          python -m pip install --disable-pip-version-check requests pytest
          python -m pip install --disable-pip-version-check yfinance

      - name: Download reusable source artifacts
        uses: actions/download-artifact@v4
        with:
          run-id: ${{ inputs.source_run_id }}
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          pattern: frozen-*
          path: data/research/universe_v2
          merge-multiple: true

      - name: Build independent WTI daily dataset from Yahoo Finance
        run: |
          python - <<'PY'
          from pathlib import Path
          import pandas as pd
          import yfinance as yf
          target = Path('data/research/universe_v2/WTI_1D.csv')
          target.parent.mkdir(parents=True, exist_ok=True)
          frame = yf.download('CL=F', start='2010-01-01', end='2026-01-01', interval='1d', auto_adjust=False, progress=False, threads=False)
          if frame is None or frame.empty:
              raise SystemExit('yahoo_wti_daily_empty')
          if isinstance(frame.columns, pd.MultiIndex):
              frame.columns = frame.columns.get_level_values(0)
          required = ['Open','High','Low','Close','Volume']
          missing = [c for c in required if c not in frame.columns]
          if missing:
              raise SystemExit(f'yahoo_wti_columns_missing:{missing}')
          frame = frame[required].dropna()
          frame.index = pd.to_datetime(frame.index, utc=True).normalize()
          frame = frame[~frame.index.duplicated(keep='last')].sort_index()
          expected = set(range(2010, 2026))
          years = set(frame.index.year)
          if expected - years:
              raise SystemExit(f'yahoo_wti_missing_years:{sorted(expected-years)}')
          out = pd.DataFrame({
              'timestamp': frame.index.astype(str),
              'open': frame['Open'].astype(float),
              'high': frame['High'].astype(float),
              'low': frame['Low'].astype(float),
              'close': frame['Close'].astype(float),
              'volume': frame['Volume'].fillna(0).astype(float),
          })
          for row in out.itertuples(index=False):
              if not (row.low <= row.open <= row.high and row.low <= row.close <= row.high):
                  raise SystemExit(f'yahoo_wti_invalid_ohlc:{row.timestamp}')
          out.to_csv(target, index=False)
          print(f'YAHOO WTI 1D COMPLETE bars={len(out)} first={out.timestamp.iloc[0]} last={out.timestamp.iloc[-1]}')
          PY

      - name: Recover three missing reusable 4H datasets
        run: |
          python - <<'PY'
          import os
          from pathlib import Path
          from tempfile import NamedTemporaryFile
          from trading_research.dukascopy_history import DukascopyClient, write_csv
          root = Path('data/research/universe_v2')
          targets = [('NAS100', '4H'), ('NZDUSD', '4H'), ('US500', '4H')]
          for instrument, timeframe in targets:
              target = root / f'{instrument}_{timeframe}.csv'
              candles = DukascopyClient().historical_prices(
                  instrument=instrument, timeframe=timeframe,
                  start_utc='2010-01-01T00:00:00+00:00', end_utc='2026-01-01T00:00:00+00:00')
              if len(candles) < 100:
                  raise SystemExit(f'insufficient_bars:{instrument}:{timeframe}:{len(candles)}')
              years = {int(c.timestamp_utc[:4]) for c in candles}
              if min(years) < 2010 or max(years) != 2025:
                  raise SystemExit(f'coverage_failure:{instrument}:{timeframe}:{min(years)}-{max(years)}')
              temp_path = None
              try:
                  with NamedTemporaryFile(prefix=f'.{target.name}.', suffix='.tmp', dir=root, delete=False) as temp:
                      temp_path = Path(temp.name)
                  digest = write_csv(candles, temp_path)
                  os.replace(temp_path, target)
                  temp_path = None
              finally:
                  if temp_path is not None:
                      temp_path.unlink(missing_ok=True)
              print(f'RECOVERY COMPLETE dataset={instrument} {timeframe} bars={len(candles)} sha256={digest}', flush=True)
          PY

      - name: Validate exact 26-dataset universe
        run: |
          python - <<'PY'
          from pathlib import Path
          from trading_research.data import load_csv
          from trading_research.dukascopy_history import INSTRUMENTS, TIMEFRAMES
          root = Path('data/research/universe_v2')
          expected = {(instrument, timeframe) for instrument in INSTRUMENTS for timeframe in TIMEFRAMES}
          missing = {(instrument, timeframe) for instrument, timeframe in expected if not (root / f'{instrument}_{timeframe}.csv').is_file()}
          if missing:
              raise SystemExit(f'missing_datasets:{sorted(missing)}')
          for instrument, timeframe in sorted(expected):
              bars = load_csv(root / f'{instrument}_{timeframe}.csv')
              years = {bar.timestamp.year for bar in bars}
              if min(years) < 2010 or max(years) != 2025:
                  raise SystemExit(f'coverage_failure:{instrument}:{timeframe}:{min(years)}-{max(years)}')
          print('DATASET SNAPSHOT PASS: 26/26')
          PY

      - name: Rebuild and verify manifest
        run: |
          python -m trading_research.rebuild_recovery_manifest
          python -m trading_research.verify_broader_universe

      - name: Run same 104-context research matrix
        run: python -m trading_research.broader_campaign_runner

      - name: Assert complete matrix evidence
        run: |
          python - <<'PY'
          import csv, json
          from pathlib import Path
          results = Path('data/research/broader_matrix_results.csv')
          summary = Path('data/research/broader_matrix_summary.json')
          if not results.is_file() or not summary.is_file():
              raise SystemExit('matrix_evidence_missing')
          with results.open('r', encoding='utf-8', newline='') as f:
              rows = list(csv.DictReader(f))
          if len(rows) != 104:
              raise SystemExit(f'matrix_row_count_mismatch:{len(rows)}')
          payload = json.loads(summary.read_text(encoding='utf-8'))
          if payload.get('contexts') != 104 or payload.get('datasets') != 26:
              raise SystemExit(f'matrix_summary_mismatch:{payload}')
          print('REPLICATION MATRIX COMPLETE: 104 contexts / 26 datasets')
          PY

      - name: Upload replication evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nova-broader-replication-independent-wti
          path: |
            data/research/universe_v2/manifest.json
            data/research/broader_matrix_results.csv
            data/research/broader_matrix_summary.json
            data/research/broader_matrix_report.md
          if-no-files-found: warn
          retention-days: 14
