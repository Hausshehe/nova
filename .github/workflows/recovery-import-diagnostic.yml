name: Recovery Import Diagnostic

on:
  workflow_dispatch:
    inputs:
      recovery_commit:
        description: "Recovery commit whose import contract should be diagnosed"
        required: true
        type: string

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Checkout recovery commit
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.recovery_commit }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install research dependencies
        run: python -m pip install --disable-pip-version-check pytest requests

      - name: Verify files
        run: |
          test -f trading_research/dukascopy_history.py
          test -f trading_research/migrate_legacy_broader_artifacts.py
          test -f trading_research/rebuild_recovery_manifest.py

      - name: Diagnose migration module import
        run: |
          python - <<'PY'
          import traceback
          try:
              from trading_research.migrate_legacy_broader_artifacts import (
                  LEGACY_SOURCE_RUN_ID,
                  LEGACY_WTI_4H_DATASET,
                  invalidate_legacy_wti_4h,
              )
              print(
                  f"MIGRATION IMPORT PASS source={LEGACY_SOURCE_RUN_ID} "
                  f"dataset={LEGACY_WTI_4H_DATASET} "
                  f"function={invalidate_legacy_wti_4h.__name__}",
                  flush=True,
              )
          except Exception as exc:
              print(f"MIGRATION IMPORT FAIL {type(exc).__name__}: {exc}", flush=True)
              traceback.print_exc()
              raise
          PY

      - name: Diagnose manifest module import
        run: |
          python - <<'PY'
          import traceback
          try:
              from trading_research.rebuild_recovery_manifest import rebuild_manifest
              print(f"MANIFEST IMPORT PASS function={rebuild_manifest.__name__}", flush=True)
          except Exception as exc:
              print(f"MANIFEST IMPORT FAIL {type(exc).__name__}: {exc}", flush=True)
              traceback.print_exc()
              raise
