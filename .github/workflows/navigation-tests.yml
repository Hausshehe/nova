name: Navigation Tests

on:
  workflow_dispatch:
  push:
    branches:
      - rebuild-navigation-engine
      - diagnostic-one-scroll
      - android-control-v2
  pull_request:
    branches:
      - rebuild-navigation-engine
      - diagnostic-one-scroll
      - fix-adaptive-app-list-handoff
      - main

jobs:
  navigation-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install test dependencies
        run: python -m pip install --disable-pip-version-check requests
      - name: Run navigation regression tests
        run: >-
          python -m unittest
          tests.test_goal_parser
          tests.test_navigation_core
          tests.test_navigation_actions
          tests.test_find_android_app
          tests.test_navigation_path
          tests.test_navigation_adapter
          tests.test_navigation_path_integration
          tests.test_navigation_observer
          tests.test_accessibility_snapshot
          tests.test_navigation_recovery_bounded
          tests.test_navigation_recovery_regression
          tests.test_navigation_rejected_activation_recovery
          tests.test_navigation_diagnostic_probe
          tests.test_navigation_activation_diagnostic
          tests.test_navigation_app_management_integration
          tests.test_navigation_resolver_semantic_labels
          tests.test_navigation_verifier_real_destination
          -v
