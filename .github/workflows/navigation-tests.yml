name: Navigation Tests

on:
  push:
    branches:
      - rebuild-navigation-engine
  pull_request:
    branches:
      - fix-adaptive-app-list-handoff
      - main

jobs:
  navigation-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Run navigation regression tests
        run: python -m unittest discover -s tests -p 'test_navigation*.py' -v
