name: Research Brain Development Run

on:
  workflow_dispatch:
  push:
    branches:
      - research-brain-development-integration

concurrency:
  group: research-brain-development-${{ github.ref }}
  cancel-in-progress: true

jobs:
  development-research:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout proposed revision
        uses: actions/checkout@v4
        with:
          clean: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install research dependencies
        run: python -m pip install --disable-pip-version-check pytest requests

      - name: Run focused safety tests before data acquisition
        run: |
          python -m pytest -q \
            tests/test_research_brain.py \
            tests/test_regime_conditioned_research.py \
            tests/test_research_brain_development_runner.py

      - name: Run development-only Research Brain experiment
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
        run: |
          python tools/run_research_brain_development.py \
            --output-dir research_artifacts/research_brain_development

      - name: Upload development research artifacts
        uses: actions/upload-artifact@v4
        with:
          name: nova-research-brain-development
          path: research_artifacts/research_brain_development/
          retention-days: 30

# Development-only run: confirmation data is never passed to this workflow.